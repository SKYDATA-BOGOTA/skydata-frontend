version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      # Importante: En el navegador del cliente, 'localhost' se refiere a su máquina,
      # por lo que debemos apuntar a localhost:3000 donde el backend expuso su puerto.
      # NO usar http://backend:3000 porque el navegador no está dentro de la red docker.
      - API_URL=http://18.234.36.47:3000/api
    networks:
      - skydata-network

networks:
  skydata-network:
    external: true