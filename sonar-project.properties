# Configuración de SonarCloud para SKYDATA Frontend
# 
# Base Normativa: ISO/IEC 5055:2021 (Source Code Quality Measurement)
# ISO/IEC 25010:2011 8.5.1 (Mantenibilidad)
# ISO/IEC 12207:2017 6.4.6.4.1 (Code Quality)
#
# SwR-M01, SwR-M02: Mantenibilidad del Código

# ID del proyecto en SonarCloud (debe coincidir con la organización)
sonar.projectKey=SKYDATA-BOGOTA_skydata-frontend

# Nombre del proyecto
sonar.projectName=skydata-frontend

# Versión del proyecto
sonar.projectVersion=1.0.0

# Directorios fuente
sonar.sources=js

# Directorios de tests
sonar.tests=tests

# Exclusiones de archivos
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.js,**/*.spec.js

# Inclusiones de archivos
sonar.inclusions=**/*.js

# Lenguaje
sonar.language=js

# Cobertura de código
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Análisis de tests
sonar.testExecutionReportPaths=coverage/test-reporter.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Límites de complejidad según ISO 5055:2021
sonar.javascript.complexity.max=10

# Límites de líneas por función según ISO 5055:2021
sonar.javascript.maxLineLength=120
