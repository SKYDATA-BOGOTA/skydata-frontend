# Configuración de SonarCloud para SKYDATA Frontend
# Base Normativa: ISO/IEC 5055:2021 (Source Code Quality Measurement)

# ID del proyecto en SonarCloud
sonar.projectKey=SKYDATA-BOGOTA_skydata-frontend

# Organización
sonar.organization=skydata-bogota

# Nombre del proyecto
sonar.projectName=skydata-frontend

# Versión del proyecto
sonar.projectVersion=1.0.0

# Directorios fuente
sonar.sources=js

# Directorios de tests
sonar.tests=tests

# Exclusiones de archivos
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.js,**/*.spec.js

# Lenguaje
sonar.language=js

# Cobertura de código
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
